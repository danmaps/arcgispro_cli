name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: cli/pyproject.toml

      - name: Install package
        working-directory: cli
        run: pip install -e ".[dev]"

      - name: Run tests
        working-directory: cli
        run: pytest -v --tb=short

  build_addin:
    name: Build add-in
    runs-on: [self-hosted, windows, arcgispro]
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found at $vswhere"
          }

          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild.exe not found"
          }

          "path=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build add-in
        working-directory: ProExporter
        shell: pwsh
        run: |
          & "${{ steps.msbuild.outputs.path }}" ProExporter.sln /restore /p:Configuration=Release

      - name: Collect add-in
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path cli/arcgispro_cli/addin | Out-Null
          $addin = Get-ChildItem -Path ProExporter -Filter *.esriAddinX -Recurse | Select-Object -First 1
          if (-not $addin) {
            throw "Built add-in (.esriAddinX) not found"
          }

          Copy-Item $addin.FullName cli/arcgispro_cli/addin/ProExporter.addin
          Get-Item cli/arcgispro_cli/addin/ProExporter.addin | Format-List FullName, Length, LastWriteTime

      - name: Upload add-in artifact
        uses: actions/upload-artifact@v4
        with:
          name: proexporter-addin
          path: cli/arcgispro_cli/addin/ProExporter.addin
          retention-days: 1

  build:
    name: Build check
    needs: [test, build_addin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cli/pyproject.toml

      - name: Install build tools
        run: pip install build

      - name: Download built add-in
        uses: actions/download-artifact@v4
        with:
          name: proexporter-addin
          path: ${{ runner.temp }}/proexporter-addin

      - name: Install built add-in
        run: cp "${{ runner.temp }}/proexporter-addin/ProExporter.addin" cli/arcgispro_cli/addin/ProExporter.addin

      - name: Build package
        working-directory: cli
        run: python -m build

      - name: Check dist contents
        run: |
          ls -la cli/dist/
          # Verify the addin is included (use glob pattern for version)
          python -c "import zipfile; import glob; whl=glob.glob('cli/dist/*.whl')[0]; z=zipfile.ZipFile(whl); print([f for f in z.namelist() if 'addin' in f])"
