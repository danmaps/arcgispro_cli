name: Release to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build_addin:
    name: Build add-in
    runs-on: [self-hosted, windows, arcgispro]
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe not found at $vswhere"
          }

          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild.exe not found"
          }

          "path=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build add-in
        working-directory: ProExporter
        shell: pwsh
        run: |
          & "${{ steps.msbuild.outputs.path }}" ProExporter.sln /restore /p:Configuration=Release

      - name: Collect add-in
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path cli/arcgispro_cli/addin | Out-Null
          $addin = Get-ChildItem -Path ProExporter -Filter *.esriAddinX -Recurse | Select-Object -First 1
          if (-not $addin) {
            throw "Built add-in (.esriAddinX) not found"
          }

          Copy-Item $addin.FullName cli/arcgispro_cli/addin/ProExporter.addin

      - name: Upload add-in artifact
        uses: actions/upload-artifact@v4
        with:
          name: proexporter-addin
          path: cli/arcgispro_cli/addin/ProExporter.addin
          retention-days: 1

  build:
    name: Build distribution
    needs: build_addin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Download built add-in
        uses: actions/download-artifact@v4
        with:
          name: proexporter-addin
          path: ${{ runner.temp }}/proexporter-addin

      - name: Install built add-in
        run: cp "${{ runner.temp }}/proexporter-addin/ProExporter.addin" cli/arcgispro_cli/addin/ProExporter.addin

      - name: Build package
        working-directory: cli
        run: python -m build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: cli/dist/
          retention-days: 1

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No credentials needed - uses OIDC trusted publishing
